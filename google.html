<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControlFace - Login</title>

    <link rel="stylesheet" href="google.css">
    <link rel="stylesheet" href="google.js">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<a href="index.html" style="text-decoration: none; color: inherit;">
    <div class="volver">
        ← Volver
    </div>
</a>

<div class="contenedor">

    <img src="3a04dc14-9913-4b76-9828-0562446929e5.png" class="logo">

    <h1>Iniciar sesión con Google</h1>

    <p class="subtitulo">
        Usa tu cuenta de Google para continuar
    </p>

    <div class="login">

        <h2>Iniciar sesión</h2>

        <p class="descripcion">
            Para continuar a <b>ControlFace</b>
        </p>

        <input
            type="email"
            id="correo"
            placeholder="Usuario@gmail.com">

        <a href="#">¿Olvidaste tu correo electrónico?</a>

        <p class="texto">
            ¿No es tu computadora? Usa una ventana privada para iniciar sesión.
            <span>Más información</span>
        </p>

        <div class="botones">

            <button class="crear">
                Crear cuenta
            </button>

            <button class="siguiente" onclick="continuar()">
                Siguiente
            </button>

        </div>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
