<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Código - ControlFace</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="Verificá tu correo.css">
</head>
<body>

    <div class="split-container">
        <div class="left-banner">
            <img src="Portada.jpeg" alt="Instituto Nacional Cornelio Azenón Sierra" class="banner-img">
            <div class="overlay"></div>
            <div class="banner-content">
                <h1 class="brand-title">Control<span class="accent-text">Face</span></h1>
                <p class="slogan">“Fácil, rápido y seguro: Así es ControlFace.”</p>
            </div>
        </div>

        <div class="right-form">
            <div class="form-wrapper">
                <h2 class="form-title">Ingresa tu código de seguridad</h2>
                <p class="form-description">
                    Hemos enviado un código de 6 dígitos a tu correo electrónico. Ingrésalo a continuación para continuar.
                </p>

                <form id="verifyForm">
                    <div class="input-group">
                        <label for="security-code">Código de seguridad</label>
                        <div class="input-container">
                            <span class="material-symbols-outlined input-icon">key</span>
                            <input type="text" id="security-code" placeholder="Ingrese el código" maxlength="6" required>
                        </div>
                    </div>

                    <div class="back-link-container">
                        <a href="Olvidaste tu contraseña.html" style="text-decoration: none;">
                            <button type="button" class="btn-back">
                                <span class="material-symbols-outlined">arrow_back</span>
                                Volver
                            </button>
                        </a>
                    </div>

                    <button type="submit" class="btn-submit">
                        Verificar Código
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="Verificá tu correo.js"></script>
</body>
</html>
